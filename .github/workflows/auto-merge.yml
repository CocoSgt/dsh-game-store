# A catalog pull request merges without a maintainer when:
#   - it touches only its author's own catalog entries (scripts/check-pr.mjs),
#   - the "Check" workflow passed on it (spec tests, package checks, site build), and
#   - the content review passed (scripts/reviewer.mjs, run on the maintainer's own machine, which does the merge).
# This workflow tells the author which of the two it is: waiting for the review, or waiting for a maintainer. The scripts run from main, never from the pull request,
# and nothing from the pull request or from a game package is executed.
name: Catalog pull requests
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list --state open --search "$HEAD_SHA" --json number,headRefOid,author,isDraft --jq ".[] | select(.headRefOid == \"$HEAD_SHA\" and (.isDraft | not))" | head -1)
          [ -z "$pr" ] && { echo "no open pull request for $HEAD_SHA"; exit 0; }
          number=$(echo "$pr" | jq -r .number); author=$(echo "$pr" | jq -r .author.login)
          git fetch --quiet origin "pull/$number/head:pr-head"
          [ "$(git rev-parse pr-head)" = "$HEAD_SHA" ] || { echo "the pull request moved on; waiting for its next check"; exit 0; }
          node scripts/check-pr.mjs --author "$author" --base origin/main --head pr-head | tee result.txt
          echo "number=$number" >> "$GITHUB_OUTPUT"
          grep -q '^auto-merge: yes$' result.txt && echo "ok=yes" >> "$GITHUB_OUTPUT" || true
      - name: Wait for the content review
        if: steps.decide.outputs.ok == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.decide.outputs.number }}" --body "检查全部通过，正在等内容审核（查恶意代码和不能接受的内容），通过后自动合并，一般在一小时内。The checks passed. A content review (malicious code, unacceptable content) runs next; the pull request merges by itself when it passes, usually within the hour."
      - name: Say why it waits
        if: steps.decide.outputs.number != '' && steps.decide.outputs.ok != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "检查通过了，但这个 Pull Request 要等维护者来看，原因：The checks passed. This pull request waits for a maintainer because:"; echo; grep '^review needed' result.txt | sed 's/^review needed: /- /'; } > body.md
          gh pr comment "${{ steps.decide.outputs.number }}" --body-file body.md
