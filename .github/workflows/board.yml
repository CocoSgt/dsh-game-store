# Message boards: an issue opened with the "Message" form gets the label game:<id>,
# which is how the store and the site find the messages of one game.
name: Message board
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            // The form writes "### Game" and the id on the next non-empty line.
            const m = /###\s*Game\s*\n+\s*([a-z0-9-]{1,40})\s*(\n|$)/.exec(context.payload.issue.body || '')
            if (!m) return
            const id = m[1]
            // Only ids that are in the catalog become labels.
            if (!fs.existsSync(`catalog/games/${id}.json`)) return
            const label = `game:${id}`
            try { await github.rest.issues.createLabel({ ...context.repo, name: label, color: '4d6bfe', description: `Messages about ${id}` }) } catch (e) { /* the label exists */ }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: context.payload.issue.number, labels: [label] })
