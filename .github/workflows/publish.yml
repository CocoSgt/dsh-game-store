# Publishes this package to npm when a version tag (v1.2.3) is pushed.
# npm trusts this workflow directly (Trusted Publishing): no token, no one-time code,
# and every version carries a provenance link back to this repository.
name: Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing
        run: npm install -g npm@latest && npm -v
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} but package.json is $v"; exit 1; }
      - name: Spec tests and catalog check
        run: |
          node --test test/*.test.mjs
          node scripts/check-catalog.mjs
      - name: Publish
        run: |
          name=$(node -p "require('./package.json').name"); v=$(node -p "require('./package.json').version")
          if npm view "$name@$v" version >/dev/null 2>&1; then echo "$name@$v is already on npm"; exit 0; fi
          npm publish --access public
          echo "Published $name@$v; npm may take a few minutes to make it available."
