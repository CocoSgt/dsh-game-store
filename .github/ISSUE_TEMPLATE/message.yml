name: 留言 / Message
description: 在一个游戏的留言板上留言。Post on a game's message board.
body:
  - type: input
    id: game
    attributes:
      label: Game
      description: 游戏的 id，例如 tidemark。从游戏页点过来时已经填好。The game's id, for example tidemark.
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message
      description: 想说什么都可以：评价、攻略、问题、建议。Reviews, tips, questions, ideas.
    validations:
      required: true
